name: Verify isolated Ally rumble integration
on:
  push:
    branches: [review/ally-rumble-installer]
permissions:
  contents: write
concurrency:
  group: ally-finish-assembly
  cancel-in-progress: true
jobs:
  review:
    if: github.repository == 'wangyinz/chiaki-ng' && github.ref == 'refs/heads/review/ally-rumble-installer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply preimage-checked rumble and installer integration
        run: python3 .review/apply_finish.py
      - name: Test rumble, touchscreen and feedback history
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -g -Igui/include tests/ally/allyrumble_test.cpp -o /tmp/rumble-tests
          /tmp/rumble-tests
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -g -Igui/include tests/ally/touchscreenrouter_test.cpp -o /tmp/touch-tests
          /tmp/touch-tests
          python3 tests/ally/test_feedback_history.py
          git diff --check
      - name: Commit assembled sources only on review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .review/apply_finish.py .github/workflows/ally-finish-apply.yml
          git add -u
          git commit -m 'Assemble verified Ally rumble separation and in-place installer'
          git push origin HEAD:refs/heads/review/ally-rumble-installer
          echo "Assembled commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
