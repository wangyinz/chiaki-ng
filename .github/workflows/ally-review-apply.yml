name: Assemble reviewed Ally input changes
on:
  push:
    branches: [review/ally-touchscreen-router]
    paths: [.review/apply_review.py, .github/workflows/ally-review-apply.yml]
permissions:
  contents: write
concurrency:
  group: ally-review-assembly
  cancel-in-progress: true
jobs:
  review:
    if: github.repository == 'wangyinz/chiaki-ng' && github.ref == 'refs/heads/review/ally-touchscreen-router'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply preimage-checked source changes
        run: python3 .review/apply_review.py
      - name: Compile and run deterministic touchscreen regressions
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -g -Igui/include tests/ally/touchscreenrouter_test.cpp -o /tmp/ally-touch-tests
          /tmp/ally-touch-tests
          python3 tests/ally/test_feedback_history.py
          git diff --check
      - name: Commit verified sources on the isolated review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .review/apply_review.py .github/workflows/ally-review-apply.yml
          git add -u
          git commit -m 'Refactor touchscreen routing and add configurable corner buttons'
          git push origin HEAD:refs/heads/review/ally-touchscreen-router
          echo "Reviewed commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
