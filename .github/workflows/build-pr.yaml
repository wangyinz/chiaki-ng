name: Build chiaki-ng pull request

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
concurrency:
  group: ally-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-windows_x64-msys2:
    name: Build windows msys2 version
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      sdl2_compat_tag: 2.32.64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git diffutils
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            fast_float:p
            fftw:p
            hidapi:p
            json-c:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p
            libevent:p

      - name: Install python protobuf and zip
        run: |
          pip install protobuf
          pacman -S git make unzip zip --noconfirm

      - name: Test touchscreen and feedback regressions
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Igui/include tests/ally/touchscreenrouter_test.cpp -o touch-tests.exe
          ./touch-tests.exe
          python tests/ally/test_feedback_history.py

      - name: Build libplacebo
        run: scripts/build-libplacebo-windows.sh

      - name: Setup ffmpeg
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          unzip ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/bin/." /mingw64/bin
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/include/." /mingw64/include
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/lib/." /mingw64/lib

      - name: Build sdl2-compat
        run: |
          INSTALL_PREFIX=/mingw64 scripts/build-sdl2-compat.sh .
          cp /mingw64/lib/pkgconfig/sdl2-compat.pc /mingw64/lib/pkgconfig/sdl2.pc

      - name: Configure chiaki-ng
        run: cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF

      - name: Build chiaki-ng
        run: cmake --build build --config Release --clean-first --target chiaki

      - name: Deploy chiaki-ng
        run: ./scripts/deploy-windows-msys2.sh chiaki-ng-Win build/gui/chiaki.exe "${{ github.workspace }}/build/third-party/cpp-steam-tools" /mingw64 gui/src/qml

      - name: Package chiaki-ng
        run: |
          CHIAKI_VERSION_MAJOR="$(sed -nE 's/^set\(CHIAKI_VERSION_MAJOR ([0-9]+)\)$/\1/p' CMakeLists.txt)"
          CHIAKI_VERSION_MINOR="$(sed -nE 's/^set\(CHIAKI_VERSION_MINOR ([0-9]+)\)$/\1/p' CMakeLists.txt)"
          CHIAKI_VERSION_PATCH="$(sed -nE 's/^set\(CHIAKI_VERSION_PATCH ([0-9]+)\)$/\1/p' CMakeLists.txt)"
          SOURCE_SHA="$(git rev-parse HEAD)"
          RELEASE_PACKAGE_FILE="chiaki-ng-win_x64-MSYS2-portable-$CHIAKI_VERSION_MAJOR.$CHIAKI_VERSION_MINOR.$CHIAKI_VERSION_PATCH-test-build-$SOURCE_SHA.zip"
          printf 'Source commit: %s\nTest series: ally-test.8\n' "$SOURCE_SHA" > chiaki-ng-Win/BUILD-INFO.txt
          sha256sum build/gui/chiaki.exe >> chiaki-ng-Win/BUILD-INFO.txt
          zip -r "$RELEASE_PACKAGE_FILE" chiaki-ng-Win
          echo "RELEASE_PACKAGE_PATH=${RELEASE_PACKAGE_FILE}" >> "$GITHUB_ENV"

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-ally-${{ github.event.pull_request.head.sha }}-portable
          path: ${{ env.RELEASE_PACKAGE_PATH }}
          if-no-files-found: error
          retention-days: 7
