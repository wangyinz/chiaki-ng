name: Build Ally Windows packages

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ally-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows_x64-msys2:
    name: Windows x64 installer and portable
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      sdl2_compat_tag: 2.32.64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git diffutils
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            fast_float:p
            fftw:p
            hidapi:p
            json-c:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p
            libevent:p

      - name: Install python protobuf and zip
        run: |
          pip install protobuf
          pacman -S git make unzip zip --noconfirm
      - name: Test Ally input, feedback, rumble and haptics diagnostics
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Igui/include tests/ally/touchscreenrouter_test.cpp -o touch-tests.exe
          ./touch-tests.exe
          python tests/ally/test_feedback_history.py
          g++ -std=c++17 -Wall -Wextra -Werror -Igui/include tests/ally/allyrumble_test.cpp -o rumble-tests.exe
          ./rumble-tests.exe
          g++ -std=c++17 -Wall -Wextra -Werror -Igui/include tests/ally/haptics_pcm_audit_test.cpp -o haptics-pcm-tests.exe
          ./haptics-pcm-tests.exe
          g++ -std=c++17 -Wall -Wextra -Werror -Igui/include tests/ally/haptics_capture_test.cpp -o haptics-capture-tests.exe
          rm -f haptics-test.chpcm haptics-test.csv
          CHIAKI_HAPTICS_CAPTURE=haptics-test.chpcm ./haptics-capture-tests.exe
          python scripts/analyze-ally-haptics.py haptics-test.chpcm --csv haptics-test.csv
          test "$(( $(wc -l < haptics-test.csv) - 1 ))" -eq 4096
      - name: Build libplacebo
        run: scripts/build-libplacebo-windows.sh
      - name: Setup ffmpeg
        run: |
          curl -fLO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          unzip ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/bin/." /mingw64/bin
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/include/." /mingw64/include
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/lib/." /mingw64/lib
      - name: Build sdl2-compat
        run: |
          INSTALL_PREFIX=/mingw64 scripts/build-sdl2-compat.sh .
          cp /mingw64/lib/pkgconfig/sdl2-compat.pc /mingw64/lib/pkgconfig/sdl2.pc
      - name: Configure chiaki-ng
        run: cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF
      - name: Build chiaki-ng
        run: cmake --build build --config Release --target chiaki
      - name: Deploy chiaki-ng
        run: ./scripts/deploy-windows-msys2.sh chiaki-ng-Win build/gui/chiaki.exe "${{ github.workspace }}/build/third-party/cpp-steam-tools" /mingw64 gui/src/qml
      - name: Stamp source identity and package portable
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          VERSION="$(cat build/ally-build-version.txt)"
          mkdir -p packages
          printf 'Source commit: %s\nBuild version: %s\n' "$SOURCE_SHA" "$VERSION" > chiaki-ng-Win/BUILD-INFO.txt
          sha256sum build/gui/chiaki.exe >> chiaki-ng-Win/BUILD-INFO.txt
          zip -rq "packages/chiaki-ng-$VERSION-win-x64-portable.zip" chiaki-ng-Win
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "ALLY_BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Compile overwrite installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source }
          & $iscc "/DMyAppVersion=$env:ALLY_BUILD_VERSION" scripts/chiaki-ng.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $name = "chiaki-ng-$env:ALLY_BUILD_VERSION-win-x64-setup.exe"
          Move-Item chiaki-ng-windows-installer.exe (Join-Path 'packages' $name)
          "INSTALLER_PATH=packages/$name" >> $env:GITHUB_ENV
      - name: Test in-place reinstall and user settings preservation
        shell: pwsh
        run: ./scripts/test-windows-upgrade.ps1 -Installer $env:INSTALLER_PATH
      - name: Checksum installer and portable
        run: (cd packages && sha256sum *.exe *.zip > SHA256SUMS.txt)
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-ally-${{ env.SOURCE_SHA }}-installer
          path: |
            ${{ env.INSTALLER_PATH }}
            packages/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-ally-${{ env.SOURCE_SHA }}-portable
          path: |
            packages/*-portable.zip
            packages/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload installer test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/chiaki-install-*.log
          if-no-files-found: ignore
          retention-days: 7
