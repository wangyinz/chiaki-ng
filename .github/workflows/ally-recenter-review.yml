name: Verify isolated Ally recenter candidate
on:
  push:
    branches: [fix/ally-recenter-diagnostics]
permissions:
  contents: write
concurrency:
  group: ally-recenter-review
  cancel-in-progress: true
jobs:
  assemble:
    if: github.repository == 'wangyinz/chiaki-ng'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Apply verified source edits without changing build workflow
        run: |
          python3 scripts/prepare-ally-recenter-review.py
          git restore .github/workflows/build-pr.yaml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/ally-recenter-diagnostics.md')
          s=p.read_text().replace('and adds the motion regression to its early tests', 'without modifying the existing build workflow; the new motion regression is run separately during this review')
          p.write_text(s)
          PY
      - name: Test production motion and retained input behavior
        run: |
          python3 tests/ally/test_motion_reset.py
          CHIAKI_TEST_SANITIZE=1 python3 tests/ally/test_motion_reset.py
          python3 tests/ally/test_feedback_history.py
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -Igui/include tests/ally/touchscreenrouter_test.cpp -o /tmp/touch-test
          /tmp/touch-test
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -Igui/include tests/ally/allyrumble_test.cpp -o /tmp/rumble-test
          /tmp/rumble-test
      - name: Commit application source only
        run: |
          git rm scripts/prepare-ally-recenter-review.py
          git add lib/src/orientation.c lib/include/chiaki/orientation.h gui/src/controllermanager.cpp gui/src/streamsession.cpp CMakeLists.txt docs/ally-recenter-diagnostics.md
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Recenter running Ally motion without cold-start gain; add source-specific rumble diagnostics'
          git push origin HEAD:fix/ally-recenter-diagnostics
